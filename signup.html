<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Create Account | Pizza Paradise</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

body{
background:linear-gradient(135deg,#ff9966,#ff5e62);
font-family:Arial,Helvetica,sans-serif;
}

.signup-container{
max-width:650px;
margin:50px auto;
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.3);
}

h2{
text-align:center;
margin-bottom:30px;
font-weight:bold;
}

.btn-register{
background:#dc3545;
color:white;
font-size:18px;
}

.btn-register:hover{
background:#bb2d3b;
color:white;
}

</style>

</head>

<body>

<div class="container">

<div class="signup-container">

<h2>🍕 Create Your Account</h2>

<form id="signupForm">

<div class="row">

<div class="col-md-6 mb-3">

<label>First Name</label>

<input
type="text"
class="form-control"
id="fname"
required>

</div>

<div class="col-md-6 mb-3">

<label>Last Name</label>

<input
type="text"
class="form-control"
id="lname"
required>

</div>

</div>

<div class="mb-3">

<label>Email Address</label>

<input
type="email"
class="form-control"
id="email"
required>

</div>

<div class="mb-3">

<label>Mobile Number</label>

<input
type="tel"
class="form-control"
id="mobile"
maxlength="10"
required>

</div>

<div class="row">

<div class="col-md-6 mb-3">

<label>Password</label>

<input
type="password"
class="form-control"
id="password"
required>

</div>

<div class="col-md-6 mb-3">

<label>Confirm Password</label>

<input
type="password"
class="form-control"
id="confirmPassword"
required>

</div>

</div>

<div class="form-check mb-4">

<input
class="form-check-input"
type="checkbox"
required>

<label class="form-check-label">

I agree to the Terms & Conditions

</label>

</div>

<button
type="submit"
class="btn btn-register w-100">

Create Account

</button>

</form>

<hr>

<div class="text-center">

Already have an account?

<a href="login.html">

Login

</a>

</div>

<br>

<div class="text-center">

<a href="index.html">

← Back to Home

</a>

</div>

</div>

</div>

<script>

document.getElementById("signupForm").addEventListener("submit",function(e){

e.preventDefault();

let password=document.getElementById("password").value;

let confirm=document.getElementById("confirmPassword").value;

if(password!==confirm){

alert("Passwords do not match.");

return;

}

alert("🎉 Account Created Successfully!");

window.location="login.html";

});

</script>

</body>
</html>
