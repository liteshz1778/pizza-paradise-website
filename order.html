<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Place Your Order</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

body{
background:#f5f5f5;
}

.order-header{
background:#dc3545;
color:white;
padding:50px;
text-align:center;
}

.form-container{
max-width:700px;
margin:40px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,.2);
}

.total-box{
font-size:24px;
font-weight:bold;
color:#dc3545;
}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand" href="index.html">
🍕 Pizza Paradise
</a>

<div class="navbar-nav ms-auto">

<a class="nav-link" href="index.html">Home</a>

<a class="nav-link" href="menu.html">Menu</a>

<a class="nav-link active" href="order.html">Order</a>

</div>

</div>

</nav>

<section class="order-header">

<h1>Place Your Order</h1>

<p>Fresh • Hot • Delivered Fast</p>

</section>

<div class="container">

<div class="form-container">

<form id="orderForm">

<div class="mb-3">

<label class="form-label">Full Name</label>

<input
type="text"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">Phone Number</label>

<input
type="tel"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">Email</label>

<input
type="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">Delivery Address</label>

<textarea
class="form-control"
rows="4"
required></textarea>

</div>

<div class="mb-3">

<label class="form-label">Select Pizza</label>

<select
id="pizza"
class="form-select"
onchange="calculate()">

<option value="299">Veg Paradise - ₹299</option>

<option value="399">Peppy Paneer - ₹399</option>

<option value="499">Non Veg Supreme - ₹499</option>

<option value="199">Golden Corn - ₹199</option>

<option value="229">BBQ Chicken - ₹229</option>

<option value="179">Paneer Onion - ₹179</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">Quantity</label>

<input
id="qty"
type="number"
value="1"
min="1"
class="form-control"
onkeyup="calculate()"
onchange="calculate()">

</div>

<div class="mb-3">

<label class="form-label">

Payment Method

</label>

<select class="form-select">

<option>Cash On Delivery</option>

<option>UPI</option>

<option>Credit Card</option>

<option>Debit Card</option>

</select>

</div>

<hr>

<div class="total-box">

Total :
₹<span id="total">
299
</span>

</div>

<br>

<button
class="btn btn-danger btn-lg w-100"
type="submit">

Place Order

</button>

</form>

</div>

</div>

<script>

function calculate(){

let price=parseInt(document.getElementById("pizza").value);

let qty=parseInt(document.getElementById("qty").value);

document.getElementById("total").innerHTML=price*qty;

}

document.getElementById("orderForm").addEventListener("submit",function(e){

e.preventDefault();

alert("🎉 Order Placed Successfully!\n\nThank you for ordering from Pizza Paradise.");

this.reset();

document.getElementById("total").innerHTML=299;

});

</script>

</body>
</html>
