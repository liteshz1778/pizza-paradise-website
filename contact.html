<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pizza Paradise | Contact Us</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
background:#f5f5f5;
}

.contact-header{
background:linear-gradient(135deg,#ff512f,#dd2476);
color:white;
padding:80px 20px;
text-align:center;
}

.contact-card{
background:white;
border-radius:15px;
padding:30px;
box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.info-box{
background:#dc3545;
color:white;
border-radius:15px;
padding:30px;
height:100%;
}

.info-box i{
font-size:30px;
margin-right:10px;
}

iframe{
border-radius:15px;
}

.social a{
font-size:25px;
margin:0 10px;
text-decoration:none;
}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand fw-bold" href="index.html">

🍕 Pizza Paradise

</a>

<div class="navbar-nav ms-auto">

<a class="nav-link" href="index.html">Home</a>

<a class="nav-link" href="menu.html">Menu</a>

<a class="nav-link" href="offers.html">Offers</a>

<a class="nav-link" href="order.html">Order</a>

<a class="nav-link active" href="contact.html">Contact</a>

</div>

</div>

</nav>

<section class="contact-header">

<h1>Contact Pizza Paradise</h1>

<p>We would love to hear from you!</p>

</section>

<div class="container my-5">

<div class="row g-4">

<div class="col-lg-7">

<div class="contact-card">

<h3 class="mb-4">

Send Us a Message

</h3>

<form id="contactForm">

<div class="mb-3">

<label>Name</label>

<input
type="text"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Subject</label>

<input
type="text"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Message</label>

<textarea
rows="5"
class="form-control"
required></textarea>

</div>

<button
class="btn btn-danger w-100 btn-lg">

Send Message

</button>

</form>

</div>

</div>

<div class="col-lg-5">

<div class="info-box">

<h3>Restaurant Info</h3>

<hr>

<p>

<i class="fas fa-map-marker-alt"></i>

123 Pizza Street,

Mumbai,

India

</p>

<p>

<i class="fas fa-phone"></i>

+91 9876543210

</p>

<p>

<i class="fas fa-envelope"></i>

info@pizzaparadise.com

</p>

<p>

<i class="fas fa-clock"></i>

Open Daily

10:00 AM - 11:00 PM

</p>

<hr>

<div class="social">

<a href="#"><i class="fab fa-facebook text-white"></i></a>

<a href="#"><i class="fab fa-instagram text-white"></i></a>

<a href="#"><i class="fab fa-twitter text-white"></i></a>

<a href="#"><i class="fab fa-youtube text-white"></i></a>

</div>

</div>

</div>

</div>

<div class="row mt-5">

<div class="col">

<iframe

src="https://maps.google.com/maps?q=Mumbai&t=&z=13&ie=UTF8&iwloc=&output=embed"

width="100%"

height="400"

loading="lazy">

</iframe>

</div>

</div>

</div>

<footer class="bg-dark text-white text-center p-4">

© 2026 Pizza Paradise | All Rights Reserved

</footer>

<script>

document.getElementById("contactForm").addEventListener("submit",function(e){

e.preventDefault();

alert("✅ Thank you for contacting Pizza Paradise.\n\nWe will get back to you soon!");

this.reset();

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
